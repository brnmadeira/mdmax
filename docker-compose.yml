version: '3.8'

services:
  mdmax:
    build:
      context: .
      dockerfile: Dockerfile
    image: mdmax:latest
    container_name: mdmax
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - mdmax-cache:/root/.mdmax
    environment:
      - PYTHONUNBUFFERED=1
    command: dashboard

volumes:
  mdmax-cache:

# Usage:
# docker-compose up                          # Run with default command (dashboard)
# docker-compose run mdmax convert input/file.pdf -o output/file.md
# docker-compose run mdmax --version
# docker-compose down                        # Clean up
