name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Tests
        run: python -m pytest -q
      - name: Without optional packages (the claude.ai situation)
        shell: bash
        run: |
          python -m pip uninstall -y pypdf xlrd
          python -m pytest -q -k "not pdf"
      - name: Build the skill zip and the Desktop extension
        run: |
          python tools/build_skill_zip.py
          python tools/build_mcpb.py
