name: Release

# Push a tag like v4.0.1 and the skill zip (claude.ai) and the extension (Claude Desktop)
# are attached to a GitHub release automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]" && python -m pytest -q
      - run: |
          python tools/build_skill_zip.py
          python tools/build_mcpb.py
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mdmax-skill.zip dist/mdmax.mcpb \
            --title "mdmax $GITHUB_REF_NAME" --notes-file CHANGELOG.md --verify-tag \
          || gh release upload "$GITHUB_REF_NAME" dist/mdmax-skill.zip dist/mdmax.mcpb --clobber
