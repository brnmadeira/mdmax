[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mdmax"
version = "4.0.0"
description = "Convert documents into compact text for Claude and measure the tokens saved"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bruno Madeira" }]
keywords = ["claude", "tokens", "markdown", "pdf", "excel", "docx", "mcp", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Markup :: Markdown",
]
# Everything else is the standard library. pypdf (PDF) and xlrd (old .xls) are pure Python.
dependencies = ["pypdf>=4", "xlrd>=2"]

[project.optional-dependencies]
exact = ["anthropic>=0.40"]
test = ["pytest>=7"]

[project.scripts]
mdmax = "mdmax.cli:main"
mdmax-mcp = "mdmax.mcp_server:main"

[project.urls]
Homepage = "https://github.com/brnmadeira/mdmax"
Issues = "https://github.com/brnmadeira/mdmax/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
